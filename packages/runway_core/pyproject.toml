[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runway-core"
version = "0.1.0"
description = "TokenRunway fuel math, pricing, and Floci/AWS store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "litellm>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["runway_core*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runway-adapters"
version = "0.1.0"
description = "Optional adapters that push usage into TokenRunway"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["runway_adapters*"]
